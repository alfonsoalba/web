# yaml-language-server: $schema=./trainer.schema.json
# Trainer CV, public data.
# Suggested location: _data/cv/trainer.yml  ->  site.data.cv.trainer
#
# Conventions
# - Translatable text is a map keyed by language: { en: "...", es: "..." }.
#   Only "en" is filled in for now; add "es" next to it.
# - Text fields accept inline Markdown (**bold**, *italic*, [text](url)).
#   Quote any value that starts with * or contains ": ".
# - Dates are quoted strings, "YYYY" or "YYYY-MM". end: null means "present".
# - This file is PUBLIC. Client names that need permission go in a separate,
#   git-ignored file (for example _data/cv/trainer_private.yml).


teaching_approach:
  - title:
      en: The attendees come first.
    text:
      en: >-
        I measure a course by what people can do when it ends. I'm there to
        help them learn, never to show how much I know.
  - title:
      en: Learning by doing.
    text:
      en: >-
        Every course is built around labs, so attendees learn each tool by
        using it on realistic exercises.
  - title:
      en: Difficult concepts in plain terms.
    text:
      en: I break hard topics into small steps, with examples, at the pace of the group.
  - title:
      en: Patient and calm.
    text:
      en: >-
        Every question gets a proper answer, and I keep a classroom or a
        video call steady when a session becomes tense.
  - title:
      en: A syllabus built from the client's needs.
    text:
      en: >-
        Before a course I talk with the client, understand the team and its
        problems, and turn that into a syllabus, the same work I did with
        product requirements as an engineering manager.


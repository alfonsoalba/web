profile:
  en: >-
    I have been training software teams since 2004, alongside a full
    engineering career as developer, CTO, engineering manager and staff
    engineer. I teach what I use in production: version control, containers,
    Linux and, more recently, building software with AI coding assistants.
    My courses are hands-on, delivered in Spanish or English, and adapted to
    each team, and most of my course material is public. I hold a PhD in
    Physics from Delft University of Technology.

